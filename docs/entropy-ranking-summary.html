<!doctype html><meta charset="utf-8"><style>body{font-family:Segoe UI;background:#fff;color:#182235;margin:0;padding:46px}h1{font-size:38px;margin:0}p{color:#5d6878}.cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}.card{border:1px solid #d8deea;border-radius:14px;padding:24px}.low{border-top:8px solid #2a9d8f}.high{border-top:8px solid #7b2cbf}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #e2e7ef}th{color:#536070}.metric{font-size:28px;font-weight:700}.note{background:#eef3ff;padding:18px;border-radius:10px}</style><h1>Entropy Ranking Summary</h1><p>Reproducible aggregate results from the committed analysis CSVs.</p><div class="cards"><div class="card low"><h2>Lowest entropy images</h2><table id="low"></table></div><div class="card high"><h2>Highest entropy images</h2><table id="high"></table></div></div><div class="note"><b>Interpretation:</b> entropy measures color-distribution complexity. Compressed file size is related, but it is not an interchangeable measure.</div><script>async function load(id,file){const text=await fetch(file).then(r=>r.text());const rows=text.trim().split(/\r?\n/).map(r=>r.split(','));const keep=[rows[0],...rows.slice(1,6)];document.querySelector(id).innerHTML=keep.map((r,i)=>`<tr>${r.slice(0,3).map(c=>`<${i?'td':'th'}>${c}</${i?'td':'th'}>`).join('')}</tr>`).join('')}load('#low','../results/lowest10.csv');load('#high','../results/highest10.csv');</script>
